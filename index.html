<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta
            name="theme-color"
            content="#f8f6f3"
        />
        <link
            rel="icon"
            type="image/png"
            href="assets/moja-favicon.png"
        />
        <title>SHADOW//GUESS — Anime Silhouette Quiz</title>
        <style>
            :root {
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                color: #f6f6fb;
                background: #090b13;
                font-synthesis: none;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                background:
                    radial-gradient(
                        ellipse at 75% -10%,
                        #27204a 0%,
                        transparent 43%
                    ),
                    radial-gradient(
                        ellipse at 0% 80%,
                        #142539 0%,
                        transparent 45%
                    ),
                    #090b13;
            }
            button,
            input {
                font: inherit;
            }
            button {
                cursor: pointer;
            }
            button:disabled {
                cursor: not-allowed;
                opacity: 0.35;
            }
            .wrap {
                max-width: 940px;
                margin: auto;
                padding: 28px 22px 50px;
            }
            .top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
            }
            .logo {
                font-weight: 900;
                letter-spacing: 0.09em;
                font-size: 15px;
            }
            .logo b {
                color: #a993ff;
            }
            .sub {
                color: #9c9db2;
                font-size: 13px;
            }
            .iconbtn {
                border: 1px solid #34354a;
                background: #181a2a;
                color: #eee;
                border-radius: 12px;
                padding: 10px 13px;
            }
            .eyebrow {
                color: #ad9dff;
                text-transform: uppercase;
                letter-spacing: 0.22em;
                font-weight: 800;
                font-size: 12px;
                margin: 0 0 13px;
            }
            h1 {
                font-size: clamp(35px, 7vw, 70px);
                line-height: 1.03;
                letter-spacing: -0.065em;
                margin: 0 0 17px;
            }
            h1 span {
                color: #ad9dff;
            }
            p {
                color: #a6a7ba;
                line-height: 1.6;
            }
            .hero {
                margin-top: 65px;
            }
            .row {
                display: flex;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
            }
            .between {
                justify-content: space-between;
            }
            .panel {
                background: #151725;
                border: 1px solid #303247;
                border-radius: 22px;
                padding: 22px;
            }
            .stats {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                margin: 30px 0;
            }
            .stat-label {
                font-size: 12px;
                color: #a6a7ba;
                text-transform: uppercase;
                letter-spacing: 0.1em;
            }
            .stat-val {
                font-size: 31px;
                font-weight: 850;
                margin-top: 5px;
            }
            .levels {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 13px;
                margin: 24px 0;
            }
            .level {
                border: 1px solid #34364b;
                border-radius: 20px;
                background: #181a2b;
                padding: 23px 15px;
                text-align: left;
                color: white;
                transition:
                    transform 0.15s,
                    border-color 0.15s;
                min-height: 148px;
            }
            .level:hover:not(:disabled) {
                transform: translateY(-3px);
                border-color: #a993ff;
            }
            .level .emoji {
                font-size: 25px;
            }
            .level strong {
                display: block;
                font-size: 22px;
                margin-top: 13px;
            }
            .level small {
                display: block;
                color: #a9a8c1;
                margin-top: 5px;
            }
            .level.easy {
                background: linear-gradient(155deg, #173b35, #161b2b);
            }
            .level.medium {
                background: linear-gradient(155deg, #43341b, #1a1b2b);
            }
            .level.hard {
                background: linear-gradient(155deg, #44212d, #1a1b2b);
            }
            .history {
                display: grid;
                grid-template-columns: repeat(6, 1fr);
                gap: 10px;
                margin: 12px 0 20px;
            }
            .slot {
                aspect-ratio: 1;
                min-width: 0;
                border: 1px dashed #4b4b65;
                border-radius: 13px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #65677f;
                font-weight: 700;
                position: relative;
                overflow: hidden;
                background: #131522;
            }
            .slot img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                background: #fff;
            }
            .slot .flag {
                position: absolute;
                right: 4px;
                bottom: 4px;
                background: #111b;
                border-radius: 8px;
                padding: 3px 6px;
                font-size: 14px;
            }
            .slot.correct {
                border: 2px solid #4fd9a2;
            }
            .slot.wrong {
                border: 2px solid #f67b9d;
            }
            .hint {
                font-size: 13px;
                color: #9698b0;
            }
            .btn {
                border: 0;
                border-radius: 14px;
                padding: 15px 22px;
                font-weight: 800;
                color: white;
                background: #765bf0;
            }
            .btn.secondary {
                background: #26283b;
                border: 1px solid #43445d;
            }
            .btn.good {
                background: #147b60;
            }
            .btn.bad {
                background: #a43e61;
            }
            .btn.wide {
                flex: 1;
            }
            .question {
                margin-top: 28px;
                text-align: center;
            }
            .question h2 {
                font-size: clamp(24px, 4vw, 38px);
                margin: 8px 0 5px;
            }
            .pill {
                display: inline-flex;
                border-radius: 100px;
                padding: 7px 14px;
                background: #27253c;
                color: #c3b6ff;
                font-size: 12px;
                font-weight: 800;
                letter-spacing: 0.08em;
            }
            .imagebox {
                width: min(100%, 430px);
                height: min(54vh, 430px);
                min-height: 260px;
                margin: 20px auto;
                display: grid;
                place-items: center;
                background: radial-gradient(circle, #f4f3fa, #cfd0dc);
                border-radius: 22px;
                overflow: hidden;
                position: relative;
            }
            .imagebox img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
            .imagebox img.silhouette {
                filter: brightness(0);
            }
            .imagebox .placeholder {
                color: #4e4e60;
                padding: 25px;
            }
            .actions {
                display: flex;
                gap: 12px;
                justify-content: center;
                flex-wrap: wrap;
            }
            .answer {
                font-size: 27px;
                font-weight: 900;
                margin: 14px 0 3px;
            }
            .answer-sub {
                color: #a9a9c1;
                font-size: 14px;
                margin-bottom: 20px;
            }
            .footer {
                margin-top: 36px;
                text-align: center;
                font-size: 12px;
                color: #75778c;
            }
            .settings {
                margin-top: 20px;
            }
            .settings summary {
                cursor: pointer;
                color: #a6a7ba;
            }
            .settings-body {
                padding-top: 15px;
            }
            .settings input {
                width: 75px;
                padding: 10px;
                background: #0d1020;
                border: 1px solid #44465d;
                color: white;
                border-radius: 9px;
            }
            .settings label {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 8px 0;
            }
            .warning {
                color: #f7c98a;
            }
            .loading {
                font-size: 15px;
                color: #999;
            }
            .hidden {
                display: none !important;
            }
            .results {
                margin-top: 55px;
            }
            .results h1 {
                margin-bottom: 20px;
            }
            .results-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
            .result-card {
                padding: 12px;
                border-radius: 16px;
                background: #181a2b;
                border: 1px solid #37384b;
            }
            .result-card img {
                height: 120px;
                width: 100%;
                object-fit: contain;
                background: #eee;
                border-radius: 10px;
            }
            .result-card strong {
                display: block;
                margin-top: 9px;
                font-size: 13px;
            }
            .result-card small {
                color: #a3a4bb;
            }
            .status {
                font-size: 12px;
                font-weight: 800;
            }
            .green {
                color: #57e5ae;
            }
            .red {
                color: #ff7f9d;
            }
            .toast {
                padding: 12px;
                background: #493b23;
                border: 1px solid #947042;
                border-radius: 12px;
                color: #f8e5c2;
                margin-top: 15px;
            }
            .source {
                font-size: 12px;
                color: #9fa1b7;
            }
            .upload {
                margin: 14px 0;
                padding: 12px;
                border: 1px dashed #585973;
                border-radius: 13px;
                text-align: left;
            }
            .upload input {
                width: 100%;
                font-size: 12px;
            }
            .smallbtn {
                padding: 9px 12px;
                font-size: 12px;
            }
            .imagebox .loading-overlay {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                background: #dedee9;
                color: #424257;
                font-weight: 700;
                padding: 20px;
            }
            .file-help {
                font-size: 12px;
                color: #a9a9bd;
            }
            @media (max-width: 570px) {
                .wrap {
                    padding: 20px 15px 36px;
                }
                .hero {
                    margin-top: 42px;
                }
                .levels {
                    gap: 8px;
                }
                .level {
                    padding: 15px 11px;
                    min-height: 125px;
                }
                .level strong {
                    font-size: 16px;
                }
                .level small {
                    font-size: 11px;
                }
                .history {
                    gap: 6px;
                }
                .stats {
                    margin: 22px 0;
                }
                .panel {
                    padding: 16px;
                }
                .results-grid {
                    gap: 7px;
                }
                .result-card {
                    padding: 7px;
                }
                .result-card img {
                    height: 85px;
                }
                .result-card strong {
                    font-size: 11px;
                }
                .imagebox {
                    min-height: 240px;
                    height: 42vh;
                }
            }

            /* Image fit: preserve the entire image, including portrait and landscape assets. */
            .imagebox {
                display: flex;
                align-items: center;
                justify-content: center;
                min-width: 0;
                min-height: 0;
                overflow: hidden;
            }
            .imagebox > img {
                display: block;
                width: auto !important;
                height: auto !important;
                max-width: 100% !important;
                max-height: 100% !important;
                min-width: 0;
                min-height: 0;
                object-fit: contain !important;
                object-position: center center;
                flex: 0 1 auto;
            }
            .imagebox > .loading-overlay {
                width: 100%;
                height: 100%;
            }

            body:has(.question) {
                min-height: 100dvh;

                }
                body:has(.question) .question-toolbar .pill {
                    font-size: 10px;
                    padding: 6px 8px;
                }
                body:has(.question) .question-toolbar .iconbtn {
                    padding: 8px 9px;
                }
            }

            /* Smooth reveal: keep both pictures in the same frame during the crossfade. */
            .question .imagebox {
                isolation: isolate;
            }
            .question .imagebox .reveal-color {
                position: absolute !important;
                inset: 0;
                width: 100% !important;
                height: 100% !important;
                max-width: 100% !important;
                max-height: 100% !important;
                object-fit: contain !important;
                object-position: center;
                opacity: 0;
                transform: scale(0.985);
                transition:
                    opacity 650ms ease,
                    transform 650ms ease;
                pointer-events: none;
                z-index: 2;
                padding: inherit;
            }
            .question .imagebox .reveal-color.is-visible {
                opacity: 1;
                transform: scale(1);
            }
            @media (prefers-reduced-motion: reduce) {
                .question .imagebox .reveal-color {
                    transition: none;
                }
            }

            /* Reserve answer space before reveal so the image and controls never jump. */
            body:has(.question) .question {
                grid-template-rows: auto auto minmax(0, 1fr) auto auto;
            }
            .question .answer-details {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                min-height: 56px;
                opacity: 0;
                visibility: hidden;
                transform: translateY(5px);
                transition:
                    opacity 420ms ease,
                    transform 420ms ease,
                    visibility 0s linear 420ms;
                pointer-events: none;
            }
            .question .answer-details.is-visible {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
                transition:
                    opacity 420ms ease,
                    transform 420ms ease,
                    visibility 0s;
            }
            .question .answer-details .answer,
            .question .answer-details .answer-sub {
                margin: 0;
            }
            @media (prefers-reduced-motion: reduce) {
                .question .answer-details {
                    transition: none;
                    transform: none;
                }
            }
        </style>
    </head>
