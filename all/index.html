<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6f3"><link rel="icon" href="../assets/moja-favicon.png"><title>Alle Charaktere · SHADOW//GUESS</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#282428;background:#f8f6f3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 95% 0%,#f8e6e9,transparent 35%),#f8f6f3}.wrap{max-width:1220px;margin:auto;padding:30px 22px 70px}header{border-bottom:1px solid #e4d9d8;padding-bottom:22px;margin-bottom:28px}.eyebrow{color:#c40030;font-size:12px;font-weight:800;letter-spacing:.18em}h1{font-size:clamp(27px,5vw,44px);letter-spacing:-.045em;margin:7px 0}header p{color:#71686d;margin:0;font-size:14px}.group{margin:30px 0 12px;display:flex;align-items:center;justify-content:space-between}.group h2{font-size:20px;margin:0}.group span{font-size:12px;color:#8a7c80}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}.card{background:#fff;border:1px solid #e9e0de;border-radius:16px;padding:13px;min-width:0;box-shadow:0 3px 15px #3a152006}.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.image{aspect-ratio:4/5;display:grid;place-items:center;background:#f6f3f2;border-radius:10px;overflow:hidden;position:relative}.image img{width:100%;height:100%;object-fit:contain}.image small{position:absolute;left:7px;top:7px;font-size:10px;color:#766b70;background:#fffdf1e8;border-radius:5px;padding:3px 5px}.name{font-size:14px;font-weight:800;margin-top:12px}.anime{font-size:12px;color:#7c7276;margin-top:3px}.error{font-size:11px;color:#bb1236;text-align:center;padding:10px}.fallback{filter:brightness(0)}@media(max-width:540px){.wrap{padding:20px 12px 40px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:8px}.pair{gap:5px}.name{font-size:12px}.anime{font-size:11px}}
</style></head><body><main class="wrap"><header><div class="eyebrow">SHADOW//GUESS · BILDCHECK</div><h1>Alle Charaktere</h1><p>Silhouette und Original nebeneinander · Daten aus characters.js</p></header><div id="gallery"></div></main><script src="../characters.js"></script><script>
(()=>{'use strict';const root=document.getElementById('gallery');if(typeof CHARACTERS==='undefined'){root.textContent='characters.js konnte nicht geladen werden.';return;}const levels=[['easy','Leicht'],['medium','Mittel'],['hard','Schwer']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const imagePath=path=>'../'+String(path).replace(/^\.\//,'').replace(/^\//,'');root.innerHTML=levels.map(([level,title])=>{const chars=CHARACTERS.filter(c=>c.level===level);return `<section><div class="group"><h2>${title}</h2><span>${chars.length} Figuren</span></div><div class="grid">${chars.map((c,i)=>`<article class="card"><div class="pair"><div class="image"><small>Schatten</small><img class="shadow" data-src="${esc(imagePath(c.image))}" alt="Silhouette ${esc(c.name)}" loading="lazy"></div><div class="image"><small>Original</small><img src="${esc(imagePath(c.image))}" alt="${esc(c.name)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'error',textContent:'Bild fehlt'}))"></div></div><div class="name">${esc(c.name)}</div><div class="anime">${esc(c.anime)}</div></article>`).join('')}</div></section>`}).join('');
// Same edge-connected bright-background removal as the game.
async function makeSilhouette(url){const image=new Image();image.src=url;await image.decode();const w=Math.min(image.naturalWidth,650),h=Math.max(1,Math.round(image.naturalHeight*w/image.naturalWidth));const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0,w,h);const im=ctx.getImageData(0,0,w,h),d=im.data;const n=w*h,visited=new Uint8Array(n),queue=new Int32Array(n);let head=0,tail=0;function bright(i){const p=i*4;return d[p+3]<32||(d[p]>225&&d[p+1]>225&&d[p+2]>225)||(Math.min(d[p],d[p+1],d[p+2])>195&&Math.max(d[p],d[p+1],d[p+2])-Math.min(d[p],d[p+1],d[p+2])<18)}function push(i){if(!visited[i]&&bright(i)){visited[i]=1;queue[tail++]=i}}for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}while(head<tail){const i=queue[head++],x=i%w,y=(i/w)|0;if(x>0)push(i-1);if(x<w-1)push(i+1);if(y>0)push(i-w);if(y<h-1)push(i+w)}for(let i=0;i<n;i++){const p=i*4;if(visited[i]||d[p+3]<32)d[p+3]=0;else{d[p]=0;d[p+1]=0;d[p+2]=0;d[p+3]=255}}ctx.putImageData(im,0,0);return cv.toDataURL('image/png')}
const observer=new IntersectionObserver(entries=>{for(const e of entries){if(!e.isIntersecting)continue;observer.unobserve(e.target);const img=e.target;makeSilhouette(img.dataset.src).then(src=>{img.src=src}).catch(()=>{img.src=img.dataset.src;img.classList.add('fallback')})}},{rootMargin:'250px'});document.querySelectorAll('.shadow').forEach(img=>observer.observe(img));})();
</script></body></html>
